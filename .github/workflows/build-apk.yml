name: Build Android APK (Sanomed)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "platforms;android-34" "build-tools;35.0.0"

      - name: Install npm dependencies
        run: npm install

      - name: Build Web App & Sync Capacitor
        env:
          CAPACITOR_BUILD: "true"
          NEXT_PUBLIC_SUPABASE_URL: "https://kdgfxkhtfeaoabwhykvq.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_4VwHbiV8pIE5PRAgX8nhcA_SRERoP1L"
        run: |
          npm run build
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: ./android
        run: bash gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sanomed-App-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
